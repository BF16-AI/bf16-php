name: PHP CI

on: [push, pull_request]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, curl
      - run: composer validate --strict
      - run: php -l src/Client.php
      - run: php tests/smoke.php
